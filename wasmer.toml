[package]
name = "laravel-admin-system"
version = "1.0.0"
description = "Laravel Admin API System"

[command]
main = "public/index.php"
runner = "wasmer/wasi-php:8.3"

[fs]
"/" = "."

[env]
APP_ENV = "production"
APP_KEY = "base64:HxEwHiG8nyvP+tHL1ie9pDQn5cN0Trv7sozrKFVJI7c="
APP_DEBUG = "false"
APP_URL = "https://your-domain.wasmer.app"

DB_CONNECTION = "sqlite"
DB_DATABASE = "/database/database.sqlite"

SESSION_DRIVER = "file"
CACHE_STORE = "file"
QUEUE_CONNECTION = "sync"
FRONTEND_URL = "*"

[network]
allow = ["0.0.0.0:8000"]
